<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Livssyklus for avdeling via REST</title><desc id="desc">Les og valider, opprett med forelder og unik kortbetegnelse, vedlikehold med GET PUT GET, og håndter konsekvenser før deaktivering.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#12304a}.t{font:16px Arial;fill:#18384f}.s{font:14px Arial;fill:#40596b}.box{fill:#f4f8fb;stroke:#1f6680;stroke-width:2}.warn{fill:#fff0d9;stroke:#c26300}.arrow{stroke:#1f6680;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f6680"/></marker></defs><rect width="1120" height="430" rx="18" fill="#fff" stroke="#d8e2e8"/><text class="h" x="40" y="48">Avdelinger – trygg V2-livssyklus</text>
  <rect class="box" x="40" y="105" width="225" height="135" rx="12"/><text class="t" x="68" y="140">1. Les og valider</text><text class="s" x="68" y="171">flat liste + externalId</text><text class="s" x="68" y="198">forelder og unikhet</text>
  <rect class="box" x="310" y="105" width="225" height="135" rx="12"/><text class="t" x="338" y="140">2. Opprett</text><text class="s" x="338" y="171">POST komplett payload</text><text class="s" x="338" y="198">abbreviation er nøkkel</text>
  <rect class="box" x="580" y="105" width="225" height="135" rx="12"/><text class="t" x="608" y="140">3. Vedlikehold</text><text class="s" x="608" y="171">GET → endre → PUT</text><text class="s" x="608" y="198">→ GET og kontroller</text>
  <rect class="warn" x="850" y="105" width="225" height="135" rx="12"/><text class="t" x="878" y="140">4. Deaktiver</text><text class="s" x="878" y="171">håndter konsekvenser</text><text class="s" x="878" y="198">DELETE /activation</text>
  <path class="arrow" d="M265 172 H300"/><path class="arrow" d="M535 172 H570"/><path class="arrow" d="M805 172 H840"/>
  <rect x="40" y="285" width="1035" height="95" rx="10" fill="#eef5f7"/><text class="t" x="65" y="315">Viktige kontraktregler</text><text class="s" x="65" y="342">externalId er én eksakt verdi · code er opprettings-fallback · unit er create-only · PUT er full overskriving</text><text class="s" x="65" y="365">Deaktivering flytter ikke brukere eller saker og påvirker ikke automatisk barn, grupper eller postfordeling.</text>
</svg>
