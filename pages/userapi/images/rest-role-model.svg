<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Modell for roller og tilgangsfunksjoner</title><desc id="desc">Rettighetsmal kopierer roller og tilgangsfunksjoner til bruker. Loginmapping er separat.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#12304a}.t{font:16px Arial;fill:#18384f}.s{font:14px Arial;fill:#40596b}.box{fill:#f4f8fb;stroke:#1f6680;stroke-width:2}.sep{fill:#fff0d9;stroke:#c26300}.arrow{stroke:#1f6680;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f6680"/></marker></defs><rect width="1120" height="430" rx="18" fill="#fff" stroke="#d8e2e8"/><text class="h" x="40" y="48">Roller, funksjoner og loginmapping</text>
  <rect class="box" x="55" y="105" width="260" height="105" rx="12"/><text class="t" x="85" y="143">accessTemplateId</text><text class="s" x="85" y="176">godkjent rettighetsmal</text>
  <rect class="box" x="430" y="80" width="260" height="105" rx="12"/><text class="t" x="460" y="118">Roller</text><text class="s" x="460" y="148">rolle-id + avgrensningslister</text><text class="s" x="460" y="169">roleId = konkret tildeling</text>
  <rect class="box" x="430" y="220" width="260" height="105" rx="12"/><text class="t" x="460" y="258">Tilgangsfunksjoner</text><text class="s" x="460" y="290">access codes for handlinger</text>
  <rect class="box" x="805" y="150" width="260" height="105" rx="12"/><text class="t" x="835" y="188">WebSak-bruker</text><text class="s" x="835" y="220">samlet effektiv tilgang</text>
  <path class="arrow" d="M315 150 C370 150 370 132 420 132"/><path class="arrow" d="M315 166 C370 166 370 272 420 272"/><path class="arrow" d="M690 132 C750 132 750 180 795 190"/><path class="arrow" d="M690 272 C750 272 750 224 795 214"/>
  <rect class="sep" x="55" y="345" width="1010" height="52" rx="8"/><text class="t" x="75" y="368">userAccesses er separat loginmapping mot IdentityServer.</text><text class="s" x="75" y="389">Det er ikke en rolle, tilgangsfunksjon eller rettighetsmal.</text>
</svg>
