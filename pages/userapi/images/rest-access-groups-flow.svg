<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">REST-flyt for tilgangsgrupper</title><desc id="desc">Opprett eller finn en gruppe, bruk gruppe-ID for medlemskap og les resultatet tilbake.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#12304a}.t{font:16px Arial;fill:#18384f}.s{font:14px Arial;fill:#40596b}.box{fill:#f4f8fb;stroke:#1f6680;stroke-width:2}.arrow{stroke:#1f6680;stroke-width:3;fill:none;marker-end:url(#a)}.ok{fill:#e8f6ef;stroke:#21875b}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f6680"/></marker></defs><rect width="1120" height="410" rx="18" fill="#fff" stroke="#d8e2e8"/><text class="h" x="40" y="48">Tilgangsgrupper – anbefalt REST-flyt</text>
  <rect class="box" x="45" y="105" width="220" height="130" rx="12"/><text class="t" x="75" y="142">1. Finn eller opprett</text><text class="s" x="75" y="174">GET / AccessGroups</text><text class="s" x="75" y="199">POST med groupName</text>
  <rect class="box" x="325" y="105" width="220" height="130" rx="12"/><text class="t" x="355" y="142">2. Bevar groupId</text><text class="s" x="355" y="174">stabil nøkkel</text><text class="s" x="355" y="199">kontroller gyldighet</text>
  <rect class="box" x="605" y="105" width="220" height="130" rx="12"/><text class="t" x="635" y="142">3. Sett medlemskap</text><text class="s" x="635" y="174">PUT = aktivt</text><text class="s" x="635" y="199">DELETE = avsluttet</text>
  <rect class="ok" x="885" y="105" width="190" height="130" rx="12"/><text class="t" x="915" y="142">4. Les tilbake</text><text class="s" x="915" y="174">GET members/{id}</text><text class="s" x="915" y="199">verifiser ønsket tilstand</text>
  <path class="arrow" d="M265 170 H315"/><path class="arrow" d="M545 170 H595"/><path class="arrow" d="M825 170 H875"/>
  <text class="t" x="45" y="294">Foretrekk ID-baserte V2-ruter</text><text class="s" x="45" y="321">Navneoppslag krever unike navn og er mindre robust ved navneendringer.</text><text class="t" x="600" y="294">Sak og journal er egne koblinger</text><text class="s" x="600" y="321">REST støtter lesing og fjerning, men ikke oppretting av disse koblingene.</text><text class="s" x="45" y="372">Scope: userapi · Medlemskapsendringer kan gjentas som ønsket tilstand.</text>
</svg>
