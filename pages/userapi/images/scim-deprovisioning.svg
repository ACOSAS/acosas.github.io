<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">SCIM beta deprovisjonering</title><desc id="desc">Kundens flyt for å deaktivere og reaktivere brukere og grupper uten fysisk sletting.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#12304a}.t{font:16px Arial;fill:#18384f}.s{font:14px Arial;fill:#40596b}.box{fill:#f4f8fb;stroke:#1f6680;stroke-width:2}.arrow{stroke:#1f6680;stroke-width:3;fill:none;marker-end:url(#a)}.warn{fill:#fff0d9;stroke:#c26300}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f6680"/></marker></defs><rect width="1120" height="440" rx="18" fill="#fff" stroke="#d8e2e8"/>
  <text class="h" x="40" y="48">Deprovisjonering og reaktivering – SCIM beta</text><rect class="warn" x="852" y="20" width="228" height="42" rx="21"/><text class="t" x="887" y="46">Pilot med kontroll</text>
  <rect class="box" x="45" y="110" width="235" height="120" rx="12"/><text class="t" x="79" y="146">Entra endrer scope</text><text class="s" x="79" y="177">eller accountEnabled</text><text class="s" x="79" y="202">for bruker / gruppe</text>
  <rect class="box" x="330" y="110" width="235" height="120" rx="12"/><text class="t" x="365" y="146">SCIM-kall</text><text class="s" x="365" y="177">PATCH active=false</text><text class="s" x="365" y="202">eller DELETE</text>
  <rect class="box" x="615" y="110" width="235" height="120" rx="12"/><text class="t" x="650" y="146">Myk deaktivering</text><text class="s" x="650" y="177">ingen fysisk sletting</text><text class="s" x="650" y="202">repeat er idempotent</text>
  <rect class="box" x="900" y="110" width="175" height="120" rx="12"/><text class="t" x="927" y="146">Les tilbake</text><text class="s" x="927" y="177">kontroller active</text><text class="s" x="927" y="202">og pilotlogg</text>
  <path class="arrow" d="M280 170 H320"/><path class="arrow" d="M565 170 H605"/><path class="arrow" d="M850 170 H890"/>
  <rect x="45" y="275" width="1030" height="64" rx="10" fill="#eef5f7"/><text class="t" x="70" y="303">Reaktivering: PATCH eller PUT med active=true på samme SCIM-id.</text><text class="s" x="70" y="327">Ikke opprett en ny bruker når eksisterende ressurs kan reaktiveres.</text>
  <rect class="warn" x="45" y="360" width="1030" height="48" rx="8"/><text class="s" x="66" y="382">Sikkerhetsnett: deaktivering flytter ikke saker, oppgaver eller dokumenter og deaktiverer ikke underressurser.</text><text class="s" x="66" y="401">Kunden må gjennomføre organisatorisk omfordeling som en egen kontrollert aktivitet.</text>
</svg>
