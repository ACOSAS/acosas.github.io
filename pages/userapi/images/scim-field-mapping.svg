<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">SCIM beta feltmapping</title><desc id="desc">De viktigste mappingene fra Entra til SCIM og WebSak, inkludert externalId, avdeling, rettighetsmal og loginmapping.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#12304a}.th{font:700 16px Arial;fill:white}.t{font:15px Arial;fill:#18384f}.s{font:13px Arial;fill:#40596b}.line{stroke:#c9d8e1}.warn{fill:#fff0d9;stroke:#c26300}</style></defs><rect width="1120" height="520" rx="18" fill="#fff" stroke="#d8e2e8"/>
  <text class="h" x="40" y="47">SCIM-feltmapping – beta</text><rect class="warn" x="850" y="18" width="230" height="42" rx="21"/><text class="t" x="884" y="44">Verifiseres i pilot</text>
  <rect x="40" y="80" width="1040" height="42" rx="6" fill="#1f6680"/><text class="th" x="62" y="107">Entra-kilde</text><text class="th" x="315" y="107">SCIM-mål</text><text class="th" x="650" y="107">WebSak / betydning</text>
  <g class="t"><text x="62" y="153">objectId</text><text x="315" y="153">externalId</text><text x="650" y="153">Gid_DIV2 – stabil og unik korrelasjon</text><text x="62" y="195">kort brukerkode</text><text x="315" y="195">userName</text><text x="650" y="195">Gid_GidKode – unik, maks 10 tegn</text><text x="62" y="237">accountEnabled</text><text x="315" y="237">active</text><text x="650" y="237">aktivering og deaktivering</text><text x="62" y="279">avdelingens eksterne ID</text><text x="315" y="279">enterprise.department</text><text x="650" y="279">eksakt oppslag mot ett Gid_DIV1</text><text x="62" y="321">applikasjonsrolle</text><text x="315" y="321">Acos applicationRole</text><text x="650" y="321">godkjent accessTemplateId</text><text x="62" y="363">e-post, telefon, språk</text><text x="315" y="363">standard User-attributter</text><text x="650" y="363">kontaktfelt og avtalt språkmapping</text><text x="62" y="405">objectId + provider</text><text x="315" y="405">loginmapping</text><text x="650" y="405">konfigurert provider – ikke hardkodet AzureAD</text></g>
  <g class="line"><path d="M40 164 H1080"/><path d="M40 206 H1080"/><path d="M40 248 H1080"/><path d="M40 290 H1080"/><path d="M40 332 H1080"/><path d="M40 374 H1080"/><path d="M40 416 H1080"/></g>
  <rect x="40" y="447" width="1040" height="46" rx="8" fill="#eef5f7"/><text class="s" x="58" y="467">Ikke map userType: Entra member og guest følger samme flyt.</text><text class="s" x="58" y="486">Full mapping, retning og krav står i Feltmapping og generert SCIM-referanse.</text>
</svg>
