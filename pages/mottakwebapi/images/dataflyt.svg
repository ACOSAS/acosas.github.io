<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Dataflyt for Acos Mottak WebApi</title>
  <desc id="desc">Integrasjonsklient sender multipart til Mottak WebApi. API-et lagrer importobjekt i Mottak. MottakerWebsak journalf�rer i WebSak.</desc>
  <style>
